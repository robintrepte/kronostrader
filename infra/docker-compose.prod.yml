services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kronos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kronos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kronos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  inference:
    build:
      context: ..
      dockerfile: infra/Dockerfile.inference
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      KRONOS_MODEL_SIZE: ${KRONOS_MODEL_SIZE:-small}
      MAX_CONTEXT: ${MAX_CONTEXT:-512}
      USE_GPU: ${USE_GPU:-false}
    volumes:
      - hf_cache:/cache/huggingface
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  trader:
    build:
      context: ..
      dockerfile: infra/Dockerfile.trader
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kronos}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kronos}
      REDIS_URL: redis://redis:6379/0
      INFERENCE_URL: http://inference:8000
    expose:
      - "8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      inference:
        condition: service_started

  dashboard:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dashboard
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-https://YOUR_DOMAIN}
      NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-wss://YOUR_DOMAIN/ws}
      PORT: "3033"
    expose:
      - "3033"
    depends_on:
      - trader

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./hetzner/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./hetzner/certs:/etc/letsencrypt:ro
      - ./hetzner/certbot-www:/var/www/certbot:ro
    depends_on:
      - dashboard
      - trader

volumes:
  postgres_data:
  redis_data:
  hf_cache:
